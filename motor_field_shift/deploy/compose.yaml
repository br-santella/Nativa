# Field Shift API + Caddy (automatic HTTPS with Let's Encrypt).
# Variables come from deploy/.env (not versioned): DOMAIN, HF_DATA_REPO, HF_TOKEN.
services:
  api:
    build:
      context: ..
    restart: unless-stopped
    environment:
      HF_DATA_REPO: ${HF_DATA_REPO}
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - data_raw:/app/data/raw
      - data_processed:/app/data/processed
      - data_hf_cache:/app/data/.cache
      - context_cache:/app/data/cache_contexto
    expose:
      - "7860"

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data_raw:
  data_processed:
  data_hf_cache:
  context_cache:
  caddy_data:
  caddy_config:
