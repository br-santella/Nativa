# English catalog. API identifiers are preserved for compatibility.
crops:
  soja:
    name: Soybean
    scientific_name: Glycine max
    purpose: grain
    cycle_days:
      min: 100
      max: 145
      unit: days
      source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/soja/pre-producao/caracteristicas-da-especie-e-relacoes-com-o-ambiente/caracteristicas-da-soja
    water_demand_mm_per_cycle:
      min: 450
      max: 800
      unit: mm/cycle
      source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/soja/pre-producao/caracteristicas-da-especie-e-relacoes-com-o-ambiente/exigencias-climaticas/agua
    soil_requirements:
      suitable_textures:
        values:
        - medium
        note: Medium texture is an optimal reference condition. The datasheet also lists organic soils.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=1150
      ph:
        min: 5.5
        max: 6.0
        unit: pH in water
        source: https://ainfo.cnptia.embrapa.br/digital/bitstream/item/223209/1/SP-17-2020-online-1.pdf
      nitrogen:
        demand_per_tonne_of_grain:
          min: 80
          max: 80
          unit: kg N/t grain
          source: https://www.embrapa.br/web/agrobiologia/busca-de-solucoes-tecnologicas/-/produto-servico/3780/fixacao-biologica-de-nitrogenio-em-soja
        note: Approximate plant nitrogen demand. Biological nitrogen fixation with Bradyrhizobium can meet
          this demand when symbiosis is effective.
      compaction:
        note: Prefer soil without compacted layers that restrict root growth.
        source: https://ainfo.cnptia.embrapa.br/digital/bitstream/item/223209/1/SP-17-2020-online-1.pdf
      moisture:
        depletion_without_stress:
          min: 50
          max: 50
          unit: '% of available water'
          source: https://www.fao.org/4/x0490e/x0490e0e.htm
        note: Prefer well-drained soil and avoid waterlogging.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=1150
    infrastructure:
      machinery:
        values:
        - planter
        - combine_harvester
        note: A planter and combine harvester are used for mechanized grain production.
        source: https://ainfo.cnptia.embrapa.br/digital/bitstream/item/223209/1/SP-17-2020-online-1.pdf
      irrigation:
        note: Assess irrigation needs based on water availability throughout the crop cycle.
        source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/soja/pre-producao/caracteristicas-da-especie-e-relacoes-com-o-ambiente/exigencias-climaticas/agua
      labor:
        note: Plan for planter and combine harvester operation in the mechanized system.
        source: https://ainfo.cnptia.embrapa.br/digital/bitstream/item/223209/1/SP-17-2020-online-1.pdf
    soil_impacts:
    - effect: rotation_diversification
      direction: positive
      description: Soybean can be included in a rotation with grasses.
      source: https://ainfo.cnptia.embrapa.br/digital/bitstream/item/223209/1/SP-17-2020-online-1.pdf
    vulnerabilities:
    - risk: water_deficit
      stages:
      - flowering
      - grain_filling
      note: Drought during these stages can reduce pod formation and impair grain filling.
      source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/soja/pre-producao/caracteristicas-da-especie-e-relacoes-com-o-ambiente/exigencias-climaticas/agua

  milho:
    name: Grain maize
    scientific_name: Zea mays
    purpose: grain
    cycle_days:
      min: 125
      max: 180
      unit: days
      source: https://www.fao.org/4/s2022e/s2022e07.htm
      note: 'Table 6: general reference for grain maize, from sowing to harvest; not specific to a season or
        region.'
    water_demand_mm_per_cycle:
      min: 400
      max: 700
      unit: mm/cycle
      source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/milho/producao/irrigacao/manejo
    soil_requirements:
      suitable_textures:
        values:
        - medium
        note: Medium texture is an optimal reference condition. The datasheet also lists organic soils.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=238663
      ph:
        min: 5.0
        max: 7.0
        unit: pH
        note: General optimal range. The measurement method is not specified in the source.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=238663
      nitrogen:
        note: 'See sistemas.yaml: the available fertilizer reference is specific to second-season maize after
          soybean and must not be applied to first-season maize.'
      compaction:
        note: Prefer soil without compacted layers that restrict root growth.
        source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1076514/1/Sistema-de-Producao-de-Milho-para-a-Zona-da-Mata-e-Agreste-Nordestinos.pdf
      moisture:
        depletion_without_stress:
          min: 55
          max: 55
          unit: '% of available water'
          source: https://www.fao.org/4/x0490e/x0490e0e.htm
        note: Prefer well-drained soil.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=238663
    infrastructure:
      machinery:
        values:
        - planter
        - combine_harvester
        note: A planter and combine harvester are used for mechanized grain production.
        source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1076514/1/Sistema-de-Producao-de-Milho-para-a-Zona-da-Mata-e-Agreste-Nordestinos.pdf
      irrigation:
        note: Assess irrigation needs based on water availability throughout the crop cycle.
        source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/milho/producao/irrigacao/manejo
      labor:
        note: Plan for planter and combine harvester operation in the mechanized system.
        source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1076514/1/Sistema-de-Producao-de-Milho-para-a-Zona-da-Mata-e-Agreste-Nordestinos.pdf
    soil_impacts:
    - effect: residue_cover
      direction: positive
      description: Maize residues help cover the soil when retained on the surface.
      source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1076514/1/Sistema-de-Producao-de-Milho-para-a-Zona-da-Mata-e-Agreste-Nordestinos.pdf
    vulnerabilities:
    - risk: water_deficit
      stages:
      - flowering
      - grain_filling
      note: Drought during these stages can reduce grain formation and filling.
      source: https://www.embrapa.br/web/agencia-de-informacao-tecnologica/cultivos/milho/producao/irrigacao/manejo

  trigo:
    name: Wheat
    scientific_name: Triticum aestivum L.
    purpose: grain
    cycle_days:
      min: 120
      max: 150
      unit: days
      source: https://www.fao.org/4/s2022e/s2022e02.htm
    water_demand_mm_per_cycle:
      min: 450
      max: 650
      unit: mm/cycle
      source: https://www.fao.org/4/s2022e/s2022e02.htm
    soil_requirements:
      suitable_textures:
        values:
        - medium
        note: Medium texture is an optimal reference condition. The datasheet also lists organic soils.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=2114
      ph:
        min: 6.0
        max: 7.0
        unit: pH
        note: General optimal range from ECOCROP.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=2114
      nitrogen:
        sowing_fertilizer_rate:
          min: 10
          max: 30
          unit: kg N/ha
          source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1155370/1/Cultivo-de-Trigo.pdf
        topdressing_fertilizer_rate:
          min: 30
          max: 60
          unit: kg N/ha
          source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1155370/1/Cultivo-de-Trigo.pdf
        note: Ranges from Table 6 for wheat after soybean in Parana, Brazil.
      compaction:
        note: Assess physical restrictions to root growth before crop establishment.
        source: https://www.infoteca.cnptia.embrapa.br/handle/doc/1153536
      moisture:
        depletion_without_stress:
          min: 55
          max: 55
          unit: '% of available water'
          source: https://www.fao.org/4/x0490e/x0490e0e.htm
        note: Avoid sowing in waterlogged soil and assess drainage.
        source: https://www.embrapa.br/busca-de-noticias/-/noticia/90345214/cuidados-na-semeadura-do-trigo-na-regiao-sul
    infrastructure:
      machinery:
        values:
        - planter
        - combine_harvester
        note: Basic equipment for the mechanized grain production scenario.
        source: https://www.infoteca.cnptia.embrapa.br/handle/doc/1153536
    vulnerabilities:
    - risk: mosaic_disease
      note: Consider disease history when selecting the field and cultivar.
      source: https://www.embrapa.br/busca-de-noticias/-/noticia/90345214/cuidados-na-semeadura-do-trigo-na-regiao-sul
    - risk: frost
      stages:
      - heading
      note: Frost at heading can cause yield losses.
      source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/466677/1/trigo2005.pdf

  aveia_branca:
    name: White oat
    scientific_name: Avena sativa L.
    purpose: grain
    cycle_days:
      min: 120
      max: 150
      unit: days
      source: https://www.fao.org/4/s2022e/s2022e02.htm
    water_demand_mm_per_cycle:
      min: 450
      max: 650
      unit: mm/cycle
      source: https://www.fao.org/4/s2022e/s2022e02.htm
    soil_requirements:
      suitable_textures:
        values:
        - sandy
        - medium
        - clayey
        note: ECOCROP lists light, medium and heavy textures as general optimal conditions.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=481
      ph:
        min: 5.0
        max: 6.0
        unit: pH
        note: General optimal range from ECOCROP.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=481
      nitrogen:
        experimental_topdressing_rate:
          min: 0
          max: 80
          unit: kg N/ha
          source: https://doi.org/10.1590/S0103-84782004000600009
        note: Range of rates tested for white oat grain production after maize in Botucatu, Sao Paulo, Brazil.
          Experimental data.
      compaction:
        note: Assess soil physical conditions when selecting the field and preparing for sowing.
        source: https://www.bdpa.cnptia.embrapa.br/consulta/busca?b=ad&id=46408
      moisture:
        depletion_without_stress:
          min: 55
          max: 55
          unit: '% of available water'
          source: https://www.fao.org/4/x0490e/x0490e0e.htm
        note: Prefer well-drained soil.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=481
    infrastructure:
      machinery:
        values:
        - planter
        - combine_harvester
        note: Basic equipment for the mechanized grain production scenario.
        source: https://www.bdpa.cnptia.embrapa.br/consulta/busca?b=ad&id=46408
    vulnerabilities:
    - risk: leaf_rust
      note: Monitor leaf rust and consider cultivar susceptibility.
      source: https://www.bdpa.cnptia.embrapa.br/consulta/busca?b=ad&id=46408

  cevada:
    name: Barley
    scientific_name: Hordeum vulgare L.
    purpose: grain
    cycle_days:
      min: 120
      max: 150
      unit: days
      source: https://www.fao.org/4/s2022e/s2022e02.htm
    water_demand_mm_per_cycle:
      min: 450
      max: 650
      unit: mm/cycle
      source: https://www.fao.org/4/s2022e/s2022e02.htm
    soil_requirements:
      suitable_textures:
        values:
        - medium
        note: Medium texture is the optimal reference condition in ECOCROP.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=1232
      ph:
        min: 6.5
        max: 7.5
        unit: pH
        note: General optimal range from ECOCROP. Soil acidity correction depends on soil testing and local
          recommendations.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=1232
      nitrogen:
        total_fertilizer_rate:
          min: 41
          max: 60
          unit: kg N/ha
          source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1179171/1/Indicacoes-Cevada-2025-e-2026-CGPE.pdf
        reference_yield:
          min: 3.5
          max: 4.5
          unit: t grain/ha
          source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1179171/1/Indicacoes-Cevada-2025-e-2026-CGPE.pdf
        note: Scenario from Table 6.4 for barley after a legume in Parana, Brazil.
      compaction:
        note: Prioritize deep soil without compaction.
        source: https://www.embrapa.br/en/web/agencia-de-informacao-tecnologica/cultivos/cevada/pre-producao/planejamento
      moisture:
        depletion_without_stress:
          min: 55
          max: 55
          unit: '% of available water'
          source: https://www.fao.org/4/x0490e/x0490e0e.htm
        note: Prioritize well-drained soil.
        source: https://www.embrapa.br/en/web/agencia-de-informacao-tecnologica/cultivos/cevada/pre-producao/planejamento
    infrastructure:
      machinery:
        values:
        - planter
        - combine_harvester
        note: Basic equipment for the mechanized grain production scenario.
        source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1179171/1/Indicacoes-Cevada-2025-e-2026-CGPE.pdf
    vulnerabilities:
    - risk: fungal_diseases
      note: Monitor diseases such as leaf rust, net blotch and Fusarium head blight.
      source: https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1028626/1/ID43343BRSsampa.pdf

  azevem_anual:
    name: Annual ryegrass
    scientific_name: Lolium multiflorum Lam.
    purpose: cover_crop
    flowering_days:
      min: 100
      max: 120
      unit: days
      source: https://www.esalq.usp.br/biblioteca/pdf/Livro_Plantas_de_Cobertura_completo.pdf
    planting_window:
      note: March to June is a general reference for cover cropping. Validate the region, cultivar and intended
        use.
      source: https://www.esalq.usp.br/biblioteca/pdf/Livro_Plantas_de_Cobertura_completo.pdf
    soil_requirements:
      suitable_textures:
        values:
        - medium
        note: Medium texture is the optimal reference condition. The datasheet also records tolerance to light
          and heavy textures.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=7389
      ph:
        min: 5.0
        max: 7.5
        unit: pH
        note: General optimal range from ECOCROP.
        source: https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=7389
      nitrogen:
        total_fertilizer_rate: null
        note: A reference nitrogen rate for annual ryegrass used exclusively as a cover crop is still unavailable.
      compaction:
        note: During establishment planning, assess whether a compacted layer could hinder crop establishment.
        status: field_assessment_criterion
      moisture:
        depletion_without_stress:
          min: 60
          max: 60
          unit: '% of available water'
          source: https://www.fao.org/4/x0490e/x0490e0e.htm
        note: The FAO-56 value refers to ryegrass managed for hay. It is an approximate reference for the cover
          crop scenario.
        source: https://www.fao.org/4/x0490e/x0490e0e.htm
    infrastructure:
      machinery:
        values:
        - planter
        note: Equipment assumed for mechanized row establishment.
        source: https://repositorio-dspace.agricultura.gov.br/bitstream/1/300/1/cartilha_adubos_verdes_informacoes_tecnicas.pdf
    vulnerabilities:
    - risk: water_deficit
      note: The cover crop datasheet indicates relative drought tolerance. Use this information as a qualitative
        description.
      source: https://www.esalq.usp.br/biblioteca/pdf/Livro_Plantas_de_Cobertura_completo.pdf